# User of the agent command runner (agent-runner, A7-01): no login and no home directory.
u agentos-run - "Agent OS command runner" /nonexistent /usr/sbin/nologin
# The observer as a separate process (agent-watch, A7-03): no login and no home directory.
u agentos-watch - "Agent OS observer" /nonexistent /usr/sbin/nologin
