      responses:
        '200':
          description: Saved document with the new rev
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsPage' }
        '202': { $ref: '#/components/responses/AskRequired' }
        '403': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >
        A token is always required (unix socket and TCP), only in the Authorization: Bearer header; a token in the address
        (?token=) is rejected with 401 and details.reason token_in_url. Scopes read, chat, admin; the minimum scope
        of an operation is given in x-scope. The GUI token (kind gui) has admin and is passed to the GUI through an fd or socketpair
        when the child process is started, it is not stored in a file and lives only in memory (docs/adr/0003-api-auth.md).
        agent and module tokens carry a method allowlist and cannot decide permission requests.
        External clients get a token no higher than chat (kind external).
  headers:
    XRequestId:
      description: Request identifier (UUID v7); generated by the client, created by the core if absent; returned in every response and written to the log
      schema: { type: string, format: uuid }
    ETag:
      description: Document version (rev), for If-Match
      schema: { type: string }
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Request identifier (UUID v7). If not passed the core creates its own and returns it in the response
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Document version (rev) read before the change
      schema: { type: string }
  responses:
    Error:
      description: Error in the unified format
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AskRequired:
      description: Action in ask mode, a user decision is needed (POST /permission-requests/{id}/decision)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PermissionRequest' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, permission_denied, insufficient_scope, forbidden_origin, not_found, conflict, precondition_failed, precondition_required, payload_too_large, validation_failed, rate_limited, internal, core_down, migrating]
            message: { type: string, description: 'With 401 details.reason may be token_in_url' }
            details: { type: object, additionalProperties: true, description: For migrating contains migration (Migration) }
            retryable: { type: boolean }
            request_id: { type: string, format: uuid, description: Value of the request X-Request-Id }
    Health:
      type: object
      required: [status, version, api, min_client, min_gui, max_gui, user_version, capabilities, migration]
      properties:
        status: { type: string, enum: [ok, starting, degraded, migrating] }
        version: { type: string, description: Core version }
        api:
          type: object
          required: [major, minor]
          properties:
            major: { type: integer, description: Changes only on an incompatible change (new prefix /vN) }
            minor: { type: integer, description: Grows on compatible additions }
        min_client: { type: string, description: Minimum GUI version the core agrees to work with }
        min_gui: { type: string, description: Lower bound of GUI versions tested with this core }
        max_gui: { type: string, example: 0.4.x, description: Upper bound; a pattern is allowed }
        user_version: { type: [integer, 'null'], description: PRAGMA user_version of the database (set only by the migration runner); null until the core has read it }
        capabilities:
          type: array
          items: { type: string }
          description: Enabled capabilities, for example tool-results, if-match, ws-seq, terminal, observer-model, observer-process; unknown ones are ignored by the client
        migration:
          oneOf:
            - { $ref: '#/components/schemas/Migration' }
            - { type: 'null' }
    Migration:
      type: object
      required: [status, from, to]
      properties:
        status: { type: string, enum: [running, done, failed] }
        from: { type: integer, description: user_version before the migration }
        to: { type: integer, description: Target user_version }
        step: { type: [string, 'null'], description: Name of the current migration; for example 0004_chat }
        progress: { type: [number, 'null'], minimum: 0, maximum: 1 }
    Token:
      type: object
      required: [id, name, kind, scope, expires_at, revoked]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [gui, external, test, agent, module], description: 'external does not get admin (CHECK in the DB); agent and module are issued by the core' }
        scope: { type: string, enum: [read, chat, admin] }
        allowlist:
          type: [array, 'null']
          items: { type: string, description: 'Allowed method of the form POST /sessions/{id}/messages' }
          description: Only for kind agent and module, otherwise null; a request outside the list gives 403 insufficient_scope
        created_by: { type: [integer, 'null'] }
        created_at: { type: integer }
        expires_at: { type: [integer, 'null'], description: null for the GUI token (lives until the GUI process stops) }
        last_used: { type: [integer, 'null'] }
        revoked: { type: boolean }
    TokenCreate:
      type: object
      required: [name, scope]
      properties:
        name: { type: string }
        scope: { type: string, enum: [read, chat] }
        ttl_days: { type: integer, minimum: 1, maximum: 90, default: 30 }
    TokenIssued:
      allOf:
        - { $ref: '#/components/schemas/Token' }
        - type: object
          required: [token]
          properties:
            token: { type: string, description: 'Token value (agt_ + 32 random bytes in base64url), shown once; only SHA-256 is stored in the DB' }
    Folder:
      type: object
      required: [id, name, open, created_at]
      properties:
        id: { type: integer }
        parent_id: { type: [integer, 'null'] }
        name: { type: string }
        persona_id: { type: [integer, 'null'] }
        open: { type: boolean }
        created_at: { type: integer, description: unix seconds UTC }
    FolderCreate:
      type: object
      properties:
        name: { type: string }
        parent_id: { type: [integer, 'null'] }
        persona_id: { type: [integer, 'null'] }
        open: { type: boolean }
    SessionConfig:
      type: object
      description: Session settings (cfg_json); session permissions only tighten the global and persona ones
      properties:
        model: { type: [integer, 'null'], description: account_id of the model account }
        perms:
          type: object
          additionalProperties: { $ref: '#/components/schemas/PermissionMode' }
        mem: { type: boolean }
        notif: { type: string, enum: [all, important, 'off'] }
        ctx: { type: string, enum: [parent, none] }
        auto: { type: boolean }
    Session:
      type: object
      required: [id, name, unread, archived, created_at, updated_at]
      properties:
        id: { type: integer }
        folder_id: { type: [integer, 'null'] }
        parent_id: { type: [integer, 'null'], description: not null = thread }
        name: { type: string }
        persona_id: { type: [integer, 'null'] }
        effective_persona_id: { type: [integer, 'null'], description: Computed on read (session; then the nearest folder upwards) }
        path: { type: [string, 'null'] }
        cfg: { $ref: '#/components/schemas/SessionConfig' }
        unread: { type: integer }
        archived: { type: boolean }
        created_at: { type: integer }
        updated_at: { type: integer }
    SessionCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        folder_id: { type: [integer, 'null'] }
        persona_id: { type: [integer, 'null'] }
        path: { type: [string, 'null'] }
    SessionPatch:
      type: object
      properties:
        name: { type: string }
        folder_id: { type: [integer, 'null'] }
        persona_id: { type: [integer, 'null'] }
        path: { type: [string, 'null'] }
        cfg: { $ref: '#/components/schemas/SessionConfig' }
        archived: { type: boolean }
    Message:
      type: object
      required: [id, session_id, role, body_md, status, ts]
      properties:
        id: { type: integer }
        session_id: { type: integer }
        client_id: { type: [string, 'null'], format: uuid, description: Idempotency; null for agent messages }
        role: { type: string, enum: [user, agent, system, tool] }
        author: { type: [string, 'null'] }
        body_md: { type: string, description: Markdown; escaped on output; for streaming this is the accumulated text }
        status: { type: string, enum: [streaming, done, stopped, error, interrupted] }
        meta:
          type: [object, 'null']
          description: Permission cards (kind permission_request with request_id), observer confirmations, attachments (attachments)
          additionalProperties: true
        ts: { type: integer }
    Attachment:
      type: object
      required: [id, name, mime, size]
      properties:
        id: { type: integer }
        name: { type: string }
        mime: { type: string }
        size: { type: integer }
    Event:
      type: object
      required: [id, kind, sub, level, text, unread, ts]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [ai, task, msg] }
        sub: { type: string, description: 'ai: agent|watch|claude|local; task: sched|deleg|done; msg: sys|wa|tg|mail' }
        level: { type: string, enum: [info, warn, error, ok] }
        text: { type: string }
        session_id: { type: [integer, 'null'], description: null = system event }
        tab: { type: string, enum: [chat, browser, terminal, settings], default: chat, description: Computed by the core; not stored in the DB }
        source: { type: [string, 'null'] }
        unread: { type: boolean }
        ts: { type: integer }
    EventCounts:
      type: object
      description: Unread events
      properties:
        total: { type: integer }
        by_kind:
          type: object
          additionalProperties: { type: integer }
        by_sub:
          type: object
          description: 'Key of the form kind.sub, for example ai.agent'
          additionalProperties: { type: integer }
    Persona:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        color: { type: string }
        model_acc: { type: [integer, 'null'], description: account_id of an anthropic or ollama account }
        style: { type: string }
        lang: { type: string }
        signature: { type: string }
        mem_mode: { type: string, enum: [own, shared, none] }
        notif_mode: { type: string, enum: [all, important, digest, 'off'] }
        work_hours: { type: string }
        quiet_hours: { type: string }
        account_ids:
          type: array
          items: { type: integer }
    Account:
      type: object
      required: [id, type, label, status, created_at]
      properties:
        id: { type: integer }
        type: { type: string, description: 'wa, tg, gmail, anthropic, ollama etc.' }
        label: { type: string }
        status: { type: string, enum: [connected, disconnected, qr, error] }
        created_at: { type: integer }
    ConnectFlow:
      type: object
      required: [account_id, kind, status]
      properties:
        account_id: { type: integer }
        kind: { type: string, enum: [oauth, qr, token] }
        status: { type: string, enum: [pending, waiting_user, connected, failed, expired] }
        url: { type: [string, 'null'], description: Address for OAuth }
        qr_data: { type: [string, 'null'], description: String for the QR; the image is drawn by the GUI }
        expires_at: { type: [integer, 'null'] }
    Quota:
      type: object
      description: >
        Accounting by fact: usage from API responses, API key limits from rate-limit headers,
        load of the local model. The remaining subscription window (5 h) is not shown and not filled:
        there is no official API. used, rate, eta_at are computed only if a limit with remaining amount and reset is known.
      required: [account_id, kind, window_h, used, rate, updated_at]
      properties:
        account_id: { type: integer }
        kind: { type: string, enum: [api_key, local] }
        window_h: { type: [number, 'null'], description: 0 = local model without a limit; for api_key the window of the nearest limit in hours; null if the limit is unknown }
        used: { type: [number, 'null'], minimum: 0, maximum: 1, description: Share used of the tightest limit; null if the limit is unknown (only usage is shown) }
        rate: { type: [number, 'null'], description: Burn rate; times the allowed one; null if the limit is unknown }
        reset_at: { type: [integer, 'null'] }
        eta_at: { type: [integer, 'null'], description: When it runs out; only if earlier than reset_at }
        load: { type: [number, 'null'], description: Local model load 0..1 }
        usage: { oneOf: [ { $ref: '#/components/schemas/QuotaUsage' }, { type: 'null' } ] }
        limits: { oneOf: [ { $ref: '#/components/schemas/QuotaLimits' }, { type: 'null' } ] }
        updated_at: { type: integer }
    QuotaUsage:
      type: object
      required: [period, tokens_in, tokens_out, cost, currency]
      properties:
        period: { type: string, enum: [day, session] }
        session_id: { type: [integer, 'null'], description: Filled when period = session }
        tokens_in: { type: integer, minimum: 0 }
        tokens_out: { type: integer, minimum: 0 }
        cost: { type: number, minimum: 0, description: Cost at the provider rate from the configuration }
        currency: { type: string, example: USD }
    QuotaLimits:
      type: object
      description: API key limits from the rate-limit headers of provider responses
      properties:
        requests_per_min: { oneOf: [ { $ref: '#/components/schemas/QuotaLimit' }, { type: 'null' } ] }
        tokens_per_min: { oneOf: [ { $ref: '#/components/schemas/QuotaLimit' }, { type: 'null' } ] }
    QuotaLimit:
      type: object
      required: [limit, remaining]
      properties:
        limit: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0 }
        reset_at: { type: [integer, 'null'], description: unix seconds }
    ToolResult:
      type: object
      required: [request_id, kind, status]
      properties:
        request_id: { type: string, description: Identifier from the browser.command event or the user action request (a string issued by the core; differs from the permission request id) }
        kind: { type: string, enum: [browser, user] }
        status: { type: string, enum: [ok, error, timeout, cancelled, denied] }
        output: { type: string, maxLength: 262144, description: Page text or HTML or the value chosen by the user; working limit 256 KiB }
        truncated: { type: boolean, default: false }
        output_bytes: { type: integer, minimum: 0, description: Original output size before truncation }
        content_type: { type: string, example: text/plain }
        url: { type: [string, 'null'], description: Final address; browser only }
        http_status: { type: [integer, 'null'], description: Browser only }
        error: { type: [string, 'null'] }
        duration_ms: { type: integer, minimum: 0 }
    ToolResultAck:
      type: object
      required: [request_id, status]
      properties:
        request_id: { type: string }
        status: { type: string, enum: [accepted] }
    PermissionAction:
      type: string
      enum: [read, send, delete, pay, shell, browse, memory_write, config_write]
    PermissionMode:
      type: string
      enum: [allow, ask, deny]
    Permission:
      type: object
      required: [scope, scope_id, action, mode]
      properties:
        scope: { type: string, enum: [global, persona, session] }
        scope_id: { type: integer, description: 0 for global }
        action: { $ref: '#/components/schemas/PermissionAction' }
        mode: { $ref: '#/components/schemas/PermissionMode' }
    PermissionDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [allow, deny, always] }
        rule:
          type: object
          description: Required when decision=always; creates or changes a persona or global rule; session level is not allowed
          required: [scope]
          properties:
            scope: { type: string, enum: [persona, global] }
            scope_id: { type: integer, description: persona_id for persona; 0 for global }
            mode: { $ref: '#/components/schemas/PermissionMode', default: allow, description: Default allow; loosening a global deny gives 403 }
    PermissionRequest:
      type: object
      required: [id, action, source, level, status, created_at]
      description: Stored in actions_log (id = actions_log.id; decision is empty until decided); the chat card is a message with role system and meta.kind permission_request
      properties:
        id: { type: integer }
        session_id: { type: [integer, 'null'] }
        action: { $ref: '#/components/schemas/PermissionAction' }
        target: { type: [string, 'null'] }
        source: { type: string, enum: [policy, observer] }
        level: { type: string, enum: [ask, warn] }
        kind: { type: [string, 'null'], enum: [injection, phishing, dangerous_cmd, module, permission_loosen, null], description: Observer finding type (observer_findings.kind) }
        verdict: { type: [string, 'null'], enum: [blocked, asked, allowed, null], description: Observer verdict (observer_findings.verdict) }
        status: { type: string, enum: [pending, allowed, denied, expired] }
        detail: { type: [string, 'null'] }
        decided_by: { type: [string, 'null'] }
        decided_at: { type: [integer, 'null'] }
        expires_at: { type: [integer, 'null'], description: 'An unanswered request expires after 10 minutes and counts as deny (docs/adr/0005-permissions-semantics.md)' }
        created_at: { type: integer }
    ModulePlacement:
      type: string
      enum: [panel, widget, button]
    Module:
      type: object
      required: [id, name, installed, enabled, placement]
      properties:
        id: { type: string }
        name: { type: string }
        manifest: { type: object, additionalProperties: true }
        installed: { type: boolean }
        enabled: { type: boolean }
        placement: { $ref: '#/components/schemas/ModulePlacement' }
        config: { type: object, additionalProperties: true }
    Indicator:
      type: object
      required: [id, enabled, position]
      properties:
        id: { type: string, description: 'String of the form cpu, whapi, backup, quota.cl1 (a number is an account_id)' }
        enabled: { type: boolean }
        position: { type: integer }
        config:
          type: object
          description: Thresholds, period, click_action
          additionalProperties: true
    IndicatorsPage:
      type: object
      properties:
        rev: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/Indicator' }
    ThemePage:
      type: object
      properties:
        rev: { type: integer }
        theme: { type: string, enum: [auto, dark, light] }
    Task:
      type: object
      required: [id, kind, title, spec, tz, state, created_at]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [sched, deleg] }
        title: { type: string }
        spec: { type: string, description: Prompt or command }
        cron: { type: [string, 'null'], description: Cron expression; time in Asia/Jerusalem }
        tz: { type: string, default: Asia/Jerusalem }
        state: { type: string, enum: [active, paused, done] }
        persona_id: { type: [integer, 'null'] }
        session_id: { type: [integer, 'null'] }
        next_run: { type: [integer, 'null'] }
        created_at: { type: integer }
    TaskCreate:
      type: object
      properties:
        kind: { type: string, enum: [sched, deleg] }
        title: { type: string }
        spec: { type: string }
        cron: { type: [string, 'null'] }
        state: { type: string, enum: [active, paused, done] }
        persona_id: { type: [integer, 'null'] }
    TaskRun:
      type: object
      required: [id, task_id, started_at, status]
      properties:
        id: { type: integer }
        task_id: { type: integer }
        started_at: { type: integer }
        finished_at: { type: [integer, 'null'] }
        status: { type: string, enum: [running, ok, error, skipped] }
        output: { type: [string, 'null'] }
    Trigger:
      type: object
      properties:
        id: { type: integer }
        source: { type: string, description: 'mail, wa, tg, git etc.' }
        match: { type: object, additionalProperties: true }
        session_id: { type: [integer, 'null'] }
        enabled: { type: boolean }
    Tunnel:
      type: object
      required: [id, type, addr, enabled]
      properties:
        id: { type: integer }
        type: { type: string, enum: [wireguard, tailscale, ssh, cloudflare, ngrok] }
        addr: { type: string }
        descr: { type: string }
        enabled: { type: boolean }
        status: { type: [string, 'null'], description: 'Computed: up, down, error' }
    TunnelCreate:
      type: object
      properties:
        type: { type: string, enum: [wireguard, tailscale, ssh, cloudflare, ngrok] }
        addr: { type: string }
        descr: { type: string }
        enabled: { type: boolean }
    SecretInfo:
      type: object
      required: [ref, set]
      properties:
        ref: { type: string }
        set: { type: boolean }
        updated_at: { type: [integer, 'null'] }
    FileInfo:
      type: object
      required: [path, kind, size]
      properties:
        path: { type: string }
        kind: { type: string, enum: [prompt, memory] }
        size: { type: integer }
        rev: { type: string }
    Link:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        url: { type: string }
    EventSubtype:
      type: object
      required: [kind, sub, label]
      properties:
        kind: { type: string, enum: [ai, task, msg] }
        sub: { type: string, description: 'Subtype identifier, for example agent, sched, wa' }
        label: { type: string }
        icon: { type: [string, 'null'], description: Icon name from the manifest }
        enabled: { type: boolean, default: true }
    SearchHit:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string, enum: [session, message, mail, file, memory] }
        source: { type: string, enum: [local, mcp_memory], default: local, description: 'Where the memory record comes from: the local index or the memory_mcp MCP server (docs/adr/0009-memory-via-mcp.md); always local for kinds other than memory' }
        title: { type: string }
        snippet: { type: string }
        ref: { type: object, additionalProperties: true }
    SettingsPage:
      type: object
      description: Page document of the settings; the schema is defined by the agentd implementation. Secrets are not returned.
      additionalProperties: true
      properties:
        rev: { type: integer }
