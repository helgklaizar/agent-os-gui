# Draft OpenAPI contract GUI <-> agentd. Description and rules: api.md.
# Status: draft. On any mismatch with the implementation the document is corrected.
# WebSocket topics are not described in OpenAPI, see api.md section 4.
# Extensions: x-scope (read|chat|admin) - minimum token scope (docs/adr/0003-api-auth.md);
# x-local-only: true - the route is available only over the unix socket; over TCP through the tunnel it is rejected.
openapi: 3.1.0
info:
  title: agentd API (draft)
  version: 0.1.0
  description: >
    Contract between agent-shell and the agentd core. A token is always required: both on the unix socket
    $XDG_RUNTIME_DIR/agentd.sock and over TCP 127.0.0.1:4096 through the tunnel. Only
    GET /health is anonymous. Token scope: read, chat, admin (docs/adr/0003-api-auth.md).
    Every request may carry an X-Request-Id header (UUID v7, generated by the client; if absent the
    core creates the id), every response returns it (api.md section 1.2).
servers:
  - url: http://localhost/v1
    description: unix socket $XDG_RUNTIME_DIR/agentd.sock, token required
  - url: http://127.0.0.1:4096/v1
    description: only through the tunnel, token scope no higher than chat, Origin and Host are checked
security:
  - bearer: []
paths:
  /health:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
    get:
      summary: Core state, API version and compatibility (the only anonymous route)
      security: []
      responses:
        '200':
          description: The core responds (with status = migrating the migration field is filled)
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /metrics:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
    get:
      summary: Core metrics without user data (counters, histograms, queue sizes)
      description: >
        The same values go into the agent-shell --diagnose report. Request values,
        session names and message texts are not present in the metrics. The format (exposition text or JSON) is defined by the implementation.
      x-scope: admin
      x-local-only: true
      responses:
        '200':
          description: Metrics
          content:
            text/plain:
              schema: { type: string }
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Error' }
  /logout:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
    post:
      summary: End the user session
      x-scope: admin
      x-local-only: true
      responses:
        '204':
          description: Done
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tokens:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
    get:
      summary: List of tokens without values (all kinds, including agent and module)
      x-scope: admin
      x-local-only: true
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Token' }
    post:
      summary: Issue a token to an external client (kind external, scope no higher than chat); agent and module tokens are issued by the core
      x-scope: admin
      x-local-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenCreate' }
      responses:
        '201':
          description: Token issued, the value is shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenIssued' }
        '422': { $ref: '#/components/responses/Error' }
  /tokens/{id}:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    delete:
      summary: Revoke a token, including agent and module (WS connections using it are closed with code 4401)
      x-scope: admin
      x-local-only: true
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/Error' }
  /sessions:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
    get:
      summary: List of sessions and threads
      x-scope: read
      parameters:
        - { name: folder_id, in: query, schema: { type: integer } }
        - { name: parent_id, in: query, schema: { type: integer } }
        - { name: archived, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
    post:
      summary: Create a session
      x-scope: chat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '422': { $ref: '#/components/responses/Error' }
  /sessions/{id}:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      summary: Session with the computed effective persona
      x-scope: read
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Change name, folder, persona, path, settings, archive (session permissions can only be tightened)
      x-scope: chat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionPatch' }
      responses:
        '200':
          description: Session after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a session, its threads and messages (events remain without session_id)
      x-scope: chat
      responses:
        '204': { description: Deleted }
        '202': { $ref: '#/components/responses/AskRequired' }
        '404': { $ref: '#/components/responses/Error' }
  /sessions/{id}/threads:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      summary: Create a thread (inherits the persona, path and context of the parent)
      x-scope: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Thread
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/Error' }
  /sessions/{id}/read:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      summary: Open a session, reset unread and mark the events of this session as read
      x-scope: chat
      responses:
        '204': { description: Reset }
        '404': { $ref: '#/components/responses/Error' }
  /sessions/{id}/clear:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      summary: Clear the session history
      x-scope: chat
      responses:
        '204': { description: Cleared }
        '202': { $ref: '#/components/responses/AskRequired' }
        '404': { $ref: '#/components/responses/Error' }
  /sessions/{id}/export:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      summary: Export the session to ~/.agentos/export/
      x-scope: chat
      responses:
        '200':
          description: Path and size
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  size: { type: integer }
        '202': { $ref: '#/components/responses/AskRequired' }
  /sessions/{id}/messages:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      summary: History in pages, sorted by id
      x-scope: read
      parameters:
        - { name: before, in: query, schema: { type: integer }, description: id of the cursor message }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: Messages from newest to oldest
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }
    post:
      summary: Send a message (the agent reply arrives over WS session.<id>)
      x-scope: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body_md, client_id]
              properties:
                body_md: { type: string }
                client_id: { type: string, format: uuid, description: Idempotency of the outgoing queue; unique within a session }
                attachment_ids:
                  type: array
                  items: { type: integer }
      responses:
        '201':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '200':
          description: Repeat of the same client_id, the already created message is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '202': { $ref: '#/components/responses/AskRequired' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sessions/{id}/stop:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      summary: Stop the current agent reply
      x-scope: chat
      responses:
        '204': { description: Stopped }
  /sessions/{id}/tool-results:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { $ref: '#/components/parameters/XRequestId' }
    post:
      summary: Return the result of what the GUI executed (a browser command from the agent or a user action on an agent request)
      description: >
        Reply to the session.<id> browser.command event (kind browser) or to a user action request
        (kind user). Agent terminal commands are executed by the core in its own pty under uid agentos-run; the GUI
        receives only terminal.output and terminal.status frames, this route does not apply to them.
        Accepted only from
        the token that received this event, otherwise 403 permission_denied. Idempotent by request_id:
        repeating the same result returns the same 202. A different result for the same request_id
        or a closed command (completed, expired, cancelled) gives 409 conflict with
        details.reason result_exists or request_closed. Unknown request_id: 404.
        Body larger than 1 MiB: 413. Working value of output: up to 256 KiB, the client cuts the rest
        and sets truncated = true.
      x-scope: chat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToolResult' }
      responses:
        '202':
          description: Accepted (also for an identical repeat)
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolResultAck' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /sessions/{id}/attachments:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      summary: Upload an attachment (then pass the id in attachment_ids of the message)
      x-scope: chat
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Attachment accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /attachments/{id}:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      summary: Download an attachment
      x-scope: read
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
  /sessions/{id}/tasks:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      summary: Session tasks (schedule and delegation)
      x-scope: read
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
    post:
      summary: Create a task in the session
      x-scope: chat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '422': { $ref: '#/components/responses/Error' }
  /sessions/{id}/bookmarks:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      summary: Browser bookmarks of this session
      x-scope: read
      responses:
        '200':
          description: Bookmarks
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Link' }
    put:
      summary: Replace the session bookmark list
      x-scope: chat
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Link' }
      responses:
        '200':
          description: Saved
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Link' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /browser/quicklinks:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
    get:
      summary: Quick links of the browser start page
      x-scope: read
      responses:
        '200':
          description: Links
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Link' }
    put:
      summary: Replace the quick links
      x-scope: chat
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Link' }
      responses:
        '200':
          description: Saved
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Link' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /folders:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
    get:
      summary: List of folders
      x-scope: read
      responses:
        '200':
          description: Folders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Folder' }
    post:
      summary: Create a folder
      x-scope: chat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FolderCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
        '422': { $ref: '#/components/responses/Error' }
  /folders/{id}:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    patch:
      summary: Change name, parent, persona, expansion
      x-scope: chat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FolderCreate' }
      responses:
        '200':
          description: Folder after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a folder, its contents move up one level
      x-scope: chat
      responses:
        '204': { description: Deleted }
        '202': { $ref: '#/components/responses/AskRequired' }
        '404': { $ref: '#/components/responses/Error' }
  /events:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
    get:
      summary: Notification feed
      x-scope: read
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [ai, task, msg] } }
        - { name: sub, in: query, schema: { type: string } }
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: session_id, in: query, schema: { type: integer } }
        - { name: before, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: Events and unread counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  counts: { $ref: '#/components/schemas/EventCounts' }
  /events/read:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
    post:
      summary: Mark events matching a filter as read (empty body = all unread)
      x-scope: chat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer }
                kind: { type: string, enum: [ai, task, msg] }
                sub: { type: string }
                session_id: { type: integer }
      responses:
        '200':
          description: How many events were marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  marked: { type: integer }
  /events/subtypes:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
    get:
      summary: Event subtypes as core data (icon and label from the manifest; the GUI does not enumerate providers)
      x-scope: read
      responses:
        '200':
          description: Subtypes for the notification column sub-filters
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventSubtype' }
  /actions:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
    get:
      summary: Log of agent, user and schedule actions (without arguments), newest first
      x-scope: read
      parameters:
        - { name: session_id, in: query, schema: { type: integer } }
        - { name: actor, in: query, schema: { type: string, enum: [agent, cron, user, observer, module] } }
        - { name: from, in: query, schema: { type: integer }, description: unix seconds; inclusive }
        - { name: to, in: query, schema: { type: integer }, description: unix seconds; inclusive }
        - { name: cursor, in: query, schema: { type: string }, description: next_cursor of the previous page }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Log page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
                  next_cursor: { type: [string, 'null'] }
        '422': { $ref: '#/components/responses/Error' }
  /events/{id}/read:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      summary: Mark an event as read
      x-scope: chat
      responses:
        '204': { description: Marked }
        '404': { $ref: '#/components/responses/Error' }
  /permissions:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
    get:
      summary: Permission matrix
      x-scope: read
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [global, persona, session] } }
        - { name: scope_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Permission' }
  /permissions/{scope}/{scope_id}/{action}:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { name: scope, in: path, required: true, schema: { type: string, enum: [global, persona, session] } }
      - { name: scope_id, in: path, required: true, schema: { type: integer }, description: 0 for global }
      - { name: action, in: path, required: true, schema: { $ref: '#/components/schemas/PermissionAction' } }
    put:
      summary: Set a permission mode (a lower level can only tighten; loosening gives 403 and a record in observer_findings)
      x-scope: admin
      x-local-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: '#/components/schemas/PermissionMode' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permission' }
        '403': { $ref: '#/components/responses/Error' }
  /permission-requests/{id}:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      summary: Current state of a permission request (to sync clients under first-wins)
      x-scope: read
      responses:
        '200':
          description: Request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionRequest' }
        '404': { $ref: '#/components/responses/Error' }
  /permission-requests/{id}/decision:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      summary: User decision on a permission request or an observer confirmation (the first decision wins; only admin on the local socket decides, phone and external clients do not decide)
      x-scope: admin
      x-local-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionDecision' }
      responses:
        '200':
          description: Decision accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionRequest' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /search:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
    get:
      summary: Unified Ctrl+K search (core RAG)
      x-scope: read
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }
  /personas:
    parameters:
      - { $ref: '#/components/parameters/XRequestId' }
    get:
      summary: List of personas
      x-scope: read
      responses:
        '200':
          description: Personas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Persona' }
    post:
      summary: Create a persona
